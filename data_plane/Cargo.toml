[package]
name = "data_plane"
version.workspace = true
edition.workspace = true

[dependencies]
asap-planner.workspace = true
asap-executor.workspace = true
asap_sketchlib.workspace = true
serde_bytes = "0.11"
ahash = "0.8"
# The per-thread series cache of the Remote Write decoder (a table of
# indices hashed by the keys they point to).
hashbrown = "0.15"
# Shortest round-trip float digits for range responses (prometheus.rs).
ryu = "1"
libc = "0.2"
# The data plane's allocator (main.rs): many small per-request allocations.
tikv-jemallocator = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
prost = "0.13"
rmp-serde = "1"
snap = "1.1"
futures = "0.3"
form_urlencoded = "1"

[dev-dependencies]
control_plane.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json.workspace = true
