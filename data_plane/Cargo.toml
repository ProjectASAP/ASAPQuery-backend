[package]
name = "data_plane"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal crates (workspace)
asap_types.workspace = true
# Phase 9: the control plane is now an in-process library inside the
# backend binary. Wiring up the in-process OpAMP server + capability-map
# exposure is a follow-up after Phase 4 (centralized series_id
# resolver). For now this dep just makes the control_plane crate
# compile in the workspace and importable from main.rs.
control_plane = { path = "../control_plane" }

# Step C (data_plane/docs/l4node-plan-executor-design.md): data_plane
# implements `asap_sketch::exec::SummaryExecutor`, which means naming
# `asap_sketch::{L4Node, SketchQuery, exec::*}` types directly -- not
# reachable through `control_plane::asap_tier_implement`'s public
# `Vec<Rc<L4Node>>` return type alone (Rust requires importing a type's
# defining crate to implement traits on it or match its variants, even
# when a dependency's function already returns that type). Pin MUST
# match control_plane's `asap-sketch` pin exactly -- same rule as
# `crates/asap_types/Cargo.toml`'s existing pin comment: two revs of the
# same git dependency in one workspace resolve to two distinct Rust
# types that won't unify.
#
# Bumped to 64df20d (main tip, ASAPController#162, merged -- matches
# control_plane's own pin) to pick up
# `SketchQuery::PointCount.value: Option<String>`, needed for the
# named-key PointCount readout.
asap-sketch = { git = "https://github.com/ProjectASAP/ASAPController", rev = "64df20d90c3ddd519c726dea45c05e1fe5225ce6" }
# `asap_sketch::L4Node`'s own fields (`SummaryExpr::Logical(Box<QueryExpr>)`,
# `SummaryAgg { col: ColumnRef, by: Vec<ColumnId>, .. }`) are `asap-ir`
# types, not re-exported by `asap-sketch` -- `find_candidates` needs to
# walk/match them directly. Same pin-must-match rule as `asap-sketch` above.
asap-ir = { git = "https://github.com/ProjectASAP/ASAPController", rev = "64df20d90c3ddd519c726dea45c05e1fe5225ce6" }

# Shared external (workspace)
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
chrono.workspace = true
promql-parser.workspace = true
tokio.workspace = true
arc-swap.workspace = true

# Crate-specific (keep version pinned here)
form_urlencoded = "1.2"
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "1.3"
dashmap = "5.5"
uuid = { version = "1.0", features = ["v4"] }
structopt = "0.3"
urlencoding = "2.1"
flate2 = "1.0"
async-trait = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64"] }
base64 = "0.21"
hex = "0.4"
arrow = "53.4.1"
futures = "0.3"
prost = "0.13"
# Vendored modified opentelemetry-proto with first-class sketch metric
# variants from DataCollector (DDSketch / KLLSketch / CountSketch /
# CountMinSketch / HLLSketch). See docs/pipeline-query-catalog.md §5.4 in the
# DataCollector repo for the rationale.
asap_otel_proto.workspace = true
# `gzip` feature: enables CompressionEncoding::Gzip so the OTLP gRPC
# ingest server can `.accept_compressed()` gzip bodies from the
# `asap-gzip` arm's agent. control_plane already pulls tonic with this
# feature for its RuntimeSamples gRPC.
tonic = { version = "0.12", features = ["gzip"] }
tokio-stream = "0.1"
regex = "1"
prometheus = "0.13"
lazy_static = "1.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tracing-appender = "0.2"
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", branch = "main" }
# Generic MessagePack codec for decoding the heap-bearing CountSketch
# DELTA-HEAP wire frame (`MSGPACK_DELTA`) directly in the backend, WITHOUT
# adding a delta API to the public `asap_sketchlib`: the frame is decoded
# into local serde structs here, the sparse matrix delta is applied onto the
# stored matrix, and the heap is replaced — all via `asap_sketchlib`'s
# existing PUBLIC `from_legacy_matrix`/`sketch_matrix`/`topk_heap_items` API.
# Already in the lock as a transitive dep of `asap_sketchlib`.
rmp-serde = "1.3"
# Phase 3 step 3: backend ingest path consumes asap-precompute-rs for the
# SHARED envelope-parsing / delta-apply / sketch-reconstruction / merge
# logic. Query-side engine (PromQL aggregation, storage, query planner)
# is unaffected. See README §"Ingest path consumes asap-precompute-rs"
# and `docs/adr/ADR-phase3-asap-precompute-rs.md`.
# `asap-precompute-rs` lives in the `ASAPCollector` repo as a sibling
# crate alongside non-Rust submodules (telegraf / opentelemetry-go /
# opentelemetry-collector / etc.) that cargo can't recursively fetch
# during a `git` source resolution because the parent repo's submodule
# pins reference commits not reachable via `git fetch <commit>`. The
# `asap-precompute-rs` Cargo.toml itself path-deps `asap_sketchlib`
# (`../../asap_sketchlib`) — that path is meaningful only inside the
# checkout, not from cargo's git cache.
#
# We therefore consume `asap-precompute-rs` via a sibling path dep,
# matching how `asap-precompute-rs` itself path-deps `asap_sketchlib`.
# Downstream CI / reproducible builds: clone `ASAPCollector` next to
# `ASAPQuery-backend` (sibling directories under `~/repos/`) before
# `cargo build`. The path is relative so any matching layout works.
asap-precompute-rs = { path = "../../ASAPCollector/asap-precompute-rs" }
# Persistence layer (SketchStore parts / manifest / Tier-2 cache)
moka = { version = "0.12", features = ["sync"] }
memmap2 = "0.9"
crc32fast = "1.4"
# NOTE: the `asap-gorilla` path-dep + the `s3` (rust-s3) / `lru`
# crates were dropped when the superseded GORILLA1 read side
# (`gorilla_object_store`: GorillaS3Store + decode_block + the
# in-process GorillaQueryEngine) was deleted. The archive tier is
# served by the ThanosQueryEngine (Path A2) over HTTP, which needs
# none of them.

[dev-dependencies]
tempfile = "3.20.0"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sketch_db"
harness = false

[features]
#default = ["lock_profiling", "extra_debugging"]
default = []
# Enable lock profiling instrumentation
lock_profiling = []
# Enable extra debugging output
extra_debugging = []
