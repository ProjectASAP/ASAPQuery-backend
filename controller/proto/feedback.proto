// ASAP runtime-samples wire schema.
//
// Carries batches of `sketch-core::report::Record` from an
// agent's `sketch-runtime::GrpcExporter` into the controller's
// real-time decision loop. The Record payload is forwarded as
// JSON so the controller stays forward-compatible with new
// v1 schema fields without a proto rebump.
//
// Schema version is `sketch-core::report::SCHEMA_VERSION` (1
// today). A bump implies both sides get recompiled.

syntax = "proto3";

package asap.runtime.v1;

// One record per emitted bench window. Mirrors
// `sketch-core::report::Record`: the `source` / `sketch` /
// `impl_name` tuple is the per-key routing handle on the
// controller side (→ `RuntimeSamplesStore`'s `SampleKey`);
// the rest of the record rides in `payload_json` so new
// fields on `Record` flow through without a proto change.
message RuntimeRecord {
  string source      = 1;
  string sketch      = 2;
  string impl_name   = 3;
  uint32 schema_version = 4;
  string payload_json = 5;
}

// A batched push. `GrpcExporter`'s default batch is 64 records
// / 100 ms (whichever triggers first) — small enough to keep
// decision latency bounded, large enough to amortize gRPC
// per-call overhead.
message PushBatch {
  repeated RuntimeRecord records = 1;
}

message PushAck {
  // Number of records the server accepted (could be less than
  // records.size() if a few failed validation; log + continue
  // on the client side in that case).
  uint64 accepted = 1;
}

service RuntimeSamples {
  // Unary RPC per batch — simpler than bidi streaming, and the
  // client already batches before pushing so HTTP/2 mux handles
  // throughput without a per-message acks-on-stream dance.
  // tonic negotiates gzip if `Accept-Encoding: gzip` is set on
  // the server.
  rpc Push(PushBatch) returns (PushAck);
}
