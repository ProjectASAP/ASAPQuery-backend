# Sketch capability profiles.
#
# These numbers describe the performance characteristics of each sketch
# implementation. The optimizer and physical planner use them to decide
# which sketch fits within a stage's budget.
#
# Source: initial values are estimates. Run benchmarks to calibrate:
#   ./e2esdkbench --sketch-type=ddsketch --series=1000 --duration=60s
# Then update this file with measured values.
#
# Env var: CONTROLLER_SKETCH_CAPABILITIES=path/to/this/file.yml

ddsketch:
  insert_throughput: 10000000.0    # samples/sec (single core)
  query_throughput: 50000000.0     # queries/sec (single core)
  memory_bytes_per_series: 4096    # bytes
  cpu_micros_per_insert: 0.1       # µs/sample
  transmission_bytes: 4096         # bytes per flush
  supported_intents: [quantile, extrema]
  mergeable: true
  supports_delta: true
  supports_sliding_window: false

kll:
  insert_throughput: 5000000.0
  query_throughput: 20000000.0
  memory_bytes_per_series: 8192
  cpu_micros_per_insert: 0.2
  transmission_bytes: 8192
  supported_intents: [quantile, extrema]
  mergeable: true
  supports_delta: false            # KLL uses random compaction, not additive
  supports_sliding_window: false

hll:
  insert_throughput: 20000000.0
  query_throughput: 100000000.0
  memory_bytes_per_series: 16384   # 2^14 registers
  cpu_micros_per_insert: 0.05
  transmission_bytes: 16384
  supported_intents: [cardinality]
  mergeable: true
  supports_delta: true
  supports_sliding_window: false

count_sketch:
  insert_throughput: 8000000.0
  query_throughput: 10000000.0
  memory_bytes_per_series: 80000   # 2000 width × 5 depth × 8 bytes
  cpu_micros_per_insert: 0.5
  transmission_bytes: 80000
  supported_intents: [frequency]
  mergeable: true
  supports_delta: true
  supports_sliding_window: false

count_min_sketch:
  insert_throughput: 8000000.0
  query_throughput: 10000000.0
  memory_bytes_per_series: 80000
  cpu_micros_per_insert: 0.5
  transmission_bytes: 80000
  supported_intents: [frequency]
  mergeable: true
  supports_delta: true
  supports_sliding_window: false
