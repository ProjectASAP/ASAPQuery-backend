[package]
name = "control_plane"
version = "0.1.0"
edition = "2021"

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control_plane"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
axum        = { version = "0.7",  features = ["ws"] }
futures-util = "0.3"
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono      = { version = "0.4",  features = ["serde"] }
promql-parser  = "0.8"
prost          = "0.13"
bytes          = "1"
zstd           = "0.13"
parking_lot    = "0.12"
prometheus     = { version = "0.13", default-features = false, features = ["process"] }
tonic          = { version = "0.12", features = ["gzip"] }
tokio-stream   = { version = "0.1", features = ["net"] }
promql_utilities.workspace = true
asap_types.workspace = true

# Transitional pin (docs/migration-plan-backend-plan.md Phase 1b): locked to a
# specific commit on ASAPController's main, not a tag -- ASAPController has no
# tagged releases yet. Re-pin as ASAPController's IR evolves; move to a tag
# once one exists.
#
# Bumped to 150ef7d (merge of PR #142, "derive PartialOrd/Ord for
# SummaryKind") for the sketch-identity unification work (see
# scratchpad/artifacts/enum-unification-plan.md) -- SummaryKind needs Ord
# for the BTreeSet<SummaryKind> deterministic-emission-order contract in
# control_plane::physical::colored_dag::emitter::EdgeStageConfig::metric_to_family.
asap-ir = { git = "https://github.com/ProjectASAP/ASAPController", rev = "150ef7d0786d24286b578dfae9dbbcefc8fbac3e" }
asap-sketch = { git = "https://github.com/ProjectASAP/ASAPController", rev = "150ef7d0786d24286b578dfae9dbbcefc8fbac3e" }
asap-plan = { git = "https://github.com/ProjectASAP/ASAPController", rev = "150ef7d0786d24286b578dfae9dbbcefc8fbac3e" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
tokio-tungstenite = "0.21"

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"
