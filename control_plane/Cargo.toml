[package]
name = "control_plane"
version = "0.1.0"
edition = "2021"

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control_plane"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
axum        = { version = "0.7",  features = ["ws"] }
futures-util = "0.3"
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
sha2 = "0.10"
serde_yaml  = "0.9"
reqwest.workspace = true
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono      = { version = "0.4",  features = ["serde"] }
promql-parser.workspace = true
prost          = "0.13"
bytes          = "1"
parking_lot    = "0.12"
prometheus     = { version = "0.13", default-features = false, features = ["process"] }
tonic          = { version = "0.12", features = ["gzip"] }
asap_types.workspace = true
asap-physical-operators.workspace = true

# Planner's IR, replacement search, and frontends share the workspace pin.
planner-types.workspace = true
asap-aware-mapping.workspace = true
asap-frontend-promql.workspace = true
asap-frontend-sql.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
tokio-tungstenite = "0.21"

[build-dependencies]
toml = "0.8"
prost-build = "0.13"
tonic-build = "0.12"
