[package]
name = "control_plane"
version = "0.1.0"
edition = "2021"

[lib]
name = "control_plane"
path = "src/lib.rs"

[[bin]]
name = "control_plane"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",    features = ["full"] }
axum        = { version = "0.7",  features = ["ws"] }
futures-util = "0.3"
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono      = { version = "0.4",  features = ["serde"] }
# Private mirror of GreptimeTeam/promql-parser (Apache-2.0), matching
# ASAPController's frontend-promql -- carries local patches (limitk /
# limit_ratio, a batch of experimental Prometheus functions) upstream
# crates.io 0.8 doesn't have. Pinned to a commit, not the `asap` branch,
# for the same reproducibility reason as the asap-ir pin below.
promql-parser  = { git = "https://github.com/ProjectASAP/promql-parser", rev = "c51beafb361af4cc95ed62ae377862c660ceb757" }
prost          = "0.13"
bytes          = "1"
zstd           = "0.13"
parking_lot    = "0.12"
prometheus     = { version = "0.13", default-features = false, features = ["process"] }
tonic          = { version = "0.12", features = ["gzip"] }
tokio-stream   = { version = "0.1", features = ["net"] }
asap_types.workspace = true

# Transitional pin (docs/migration-plan-backend-plan.md Phase 1b): locked to a
# specific commit on ASAPController's main, not a tag -- ASAPController has no
# tagged releases yet. Re-pin as ASAPController's IR evolves; move to a tag
# once one exists.
#
# Bumped to d4c1756 (main tip) to pick up `asap_sketch::exec::{SummaryExecutor,
# execute}` (#155) -- the serving-time counterpart to `asap_plan::bind`'s
# planning-time L4Node construction, needed for
# data_plane/docs/l4node-plan-executor-design.md (Step C) -- plus #159/#161's
# fix giving `SummaryExecutor::execute()` a grouping model (a query like
# `quantile by (zone) (...)` needs one output series per zone; the
# as-merged #155 shape would have silently merged every zone's state into
# one blob). d4c1756 is a strict descendant of 7fcaf91 (the previous pin,
# "add serving-time traits to WindowKind" / Phase 2 #395), so nothing this
# repo already consumes from that revision moves.
#
# asap-plan owns the single authoritative AggIntent -> sketch-vs-exact
# implementation decision (`boundary::implementation_for`, Cascades
# "implementation rule" terminology -- see that crate's doc); capability_for
# delegates to it instead of maintaining its own parallel judgment. asap-plan
# depends only on asap-ir (per its own crate doc's layering invariant), so
# this doesn't pull in datafusion or any front-end weight. asap-sketch is
# asap-plan's own dependency (SummaryKind/SummaryParams), needed here only
# to translate Implementation into this repo's own Capability vocabulary.
asap-ir = { git = "https://github.com/ProjectASAP/ASAPController", rev = "d4c175633f6ce46b801ca2115c00fa757d5b6240" }
asap-l2 = { git = "https://github.com/ProjectASAP/ASAPController", rev = "d4c175633f6ce46b801ca2115c00fa757d5b6240" }
asap-sketch = { git = "https://github.com/ProjectASAP/ASAPController", rev = "d4c175633f6ce46b801ca2115c00fa757d5b6240" }
asap-plan = { git = "https://github.com/ProjectASAP/ASAPController", rev = "d4c175633f6ce46b801ca2115c00fa757d5b6240" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.4", features = ["util"] }
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
tokio-tungstenite = "0.21"

[build-dependencies]
prost-build = "0.13"
tonic-build = "0.12"
