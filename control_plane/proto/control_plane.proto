syntax = "proto3";

package control_plane.v1;

option go_package = "github.com/ProjectASAP/control_plane/proto/control_planev1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ── Enumerations ──────────────────────────────────────────────────────────────

enum AggType {
  AGG_TYPE_UNSPECIFIED = 0;
  AGG_TYPE_QUANTILE    = 1;
  AGG_TYPE_CARDINALITY = 2;
  AGG_TYPE_FREQUENCY   = 3;
}

enum SketchType {
  SKETCH_TYPE_UNSPECIFIED      = 0;
  SKETCH_TYPE_DDSKETCH         = 1;
  SKETCH_TYPE_KLL              = 2;
  SKETCH_TYPE_HLL              = 3;
  SKETCH_TYPE_COUNT_SKETCH     = 4;
  SKETCH_TYPE_COUNT_MIN_SKETCH = 5;
}

enum OutputMode {
  OUTPUT_MODE_UNSPECIFIED = 0;
  OUTPUT_MODE_RAW         = 1;
  OUTPUT_MODE_SKETCH      = 2;
}

enum ProcessorMode {
  PROCESSOR_MODE_UNSPECIFIED = 0;
  PROCESSOR_MODE_BATCH       = 1;
  PROCESSOR_MODE_WINDOW      = 2;
}

// ── Core types ────────────────────────────────────────────────────────────────

message QueryWorkload {
  string   metric_name    = 1;
  map<string, string> label_filters  = 2;
  repeated string     group_by_labels = 3;
  repeated AggType    aggregations    = 4;
  google.protobuf.Duration time_window   = 5;
  google.protobuf.Duration repeat_every  = 6;
  double   accuracy_sla  = 7;  // relative error, e.g. 0.01
  google.protobuf.Duration latency_sla   = 8;
}

message SketchParams {
  double   relative_accuracy = 1;  // DDSketch
  int32    k                 = 2;  // KLL
  int32    precision         = 3;  // HLL
  int32    rows              = 4;  // CountSketch / CountMinSketch
  int32    cols              = 5;
  repeated double quantiles  = 6;
}

message AgentCollectorConfig {
  OutputMode    output_mode      = 1;
  SketchType    sketch_type      = 2;
  SketchParams  sketch_params    = 3;
  repeated string aggregate_by  = 4;
  repeated string label_matchers = 5;
  google.protobuf.Duration window_duration = 6;
  ProcessorMode mode             = 7;
  bool          transmit_sketch  = 8;
  bool          drop_original    = 9;
}

message GatewayCollectorConfig {
  bool passthrough = 1;
}

message BackendCollectorConfig {
  SketchType  merge_sketch_type = 1;
  repeated string group_by     = 2;
}

message PrecomputeJob {
  string   query_expr   = 1;
  google.protobuf.Duration granularity = 2;
  string   sketch_source = 3;
  string   store_path    = 4;
}

message CollectionPlan {
  AgentCollectorConfig   agent_config   = 1;
  GatewayCollectorConfig gateway_config = 2;
  BackendCollectorConfig backend_config = 3;
  repeated PrecomputeJob precompute     = 4;
  google.protobuf.Timestamp valid_until = 5;
}

// ── RPCs ──────────────────────────────────────────────────────────────────────

message PlanRequest {
  QueryWorkload workload = 1;
}

message PlanResponse {
  CollectionPlan plan   = 1;
  string         status = 2;
}

message PlanStatusRequest {
  string metric_name = 1;
}

message PlanStatusResponse {
  CollectionPlan current_plan = 1;
  string         status       = 2;
}

service ControllerService {
  rpc Plan(PlanRequest) returns (PlanResponse);
  rpc GetPlanStatus(PlanStatusRequest) returns (PlanStatusResponse);
}
