[package]
name = "prometheus_http"
version.workspace = true
edition.workspace = true

# The Prometheus HTTP API: query parameters, response bodies, and the
# fallback client of a Prometheus-compatible server. An adapter: of this
# workspace it depends on `common` only, never on an engine or a store.
[dependencies]
common.workspace = true
# `common::FallbackClient`'s async method.
async-trait.workspace = true
ahash = "0.8"
form_urlencoded = "1"
reqwest.workspace = true
# Shortest round-trip float digits for range responses.
ryu = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `QueryLanguage::SQL`'s dialect, for the fallback's refusal test.
asap-types.workspace = true
axum.workspace = true
tokio.workspace = true
