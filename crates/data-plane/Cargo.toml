[package]
name = "data_plane"
version.workspace = true
edition.workspace = true

[dependencies]
asap-planner.workspace = true
asap-executor.workspace = true
common.workspace = true
internal_metrics.workspace = true
precompute.workspace = true
query.workspace = true
storage.workspace = true
ahash = "0.8"
# The per-thread series cache of the Remote Write decoder (a table of
# indices hashed by the keys they point to).
hashbrown = "0.15"
# Shortest round-trip float digits for range responses (prometheus.rs).
ryu = "1"
libc = "0.2"
# The data plane's allocator (main.rs): many small per-request allocations.
tikv-jemallocator = "0.6"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
prost = "0.13"
snap = "1.1"
form_urlencoded = "1"

[dev-dependencies]
async-trait.workspace = true
futures = "0.3"
control_plane.workspace = true
asap_sketchlib.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The micro benchmarks live in benchmarks/micro/ and build as examples of this
# crate (`cargo run --release -p data_plane --example <name>`).
[[example]]
name = "decode_bench"
path = "../../benchmarks/micro/decode_bench.rs"

[[example]]
name = "ingest_bench"
path = "../../benchmarks/micro/ingest_bench.rs"

[[example]]
name = "matrix_bench"
path = "../../benchmarks/micro/matrix_bench.rs"

[[example]]
name = "offset_bench"
path = "../../benchmarks/micro/offset_bench.rs"

[[example]]
name = "range_bench"
path = "../../benchmarks/micro/range_bench.rs"

[[example]]
name = "rw_corpus_bench"
path = "../../benchmarks/micro/rw_corpus_bench.rs"

[[example]]
name = "tier_bench"
path = "../../benchmarks/micro/tier_bench.rs"

[[example]]
name = "view_read_bench"
path = "../../benchmarks/micro/view_read_bench.rs"
