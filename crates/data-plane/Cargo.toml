[package]
name = "data_plane"
version.workspace = true
edition.workspace = true

[dependencies]
common.workspace = true
internal_metrics.workspace = true
precompute.workspace = true
prometheus_http.workspace = true
prometheus_remote_write.workspace = true
victoriametrics_remote_write.workspace = true
otlp.workspace = true
query.workspace = true
storage.workspace = true
# The data plane's allocator (main.rs): many small per-request allocations.
tikv-jemallocator = "0.6"
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
# The forward-mode tee's delivery workers (raw_forward.rs).
reqwest.workspace = true
form_urlencoded = "1"

[dev-dependencies]
# Plans and IR the tests and the micro benchmarks build.
asap-planner.workspace = true
asap-executor.workspace = true
futures = "0.3"
control_plane.workspace = true
asap_sketchlib.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# posix_fadvise in the tier and view-read benchmarks (cold reads).
libc = "0.2"
# Remote Write bodies built by hand, and the reference decoder's series
# cache (tests/remote_write_reference.rs).
snap = "1.1"
ahash = "0.8"
# gzip OTLP bodies (tests/ingest_protocols.rs).
flate2 = "1.0"

# The micro benchmarks live in benchmarks/micro/ and build as examples of this
# crate (`cargo run --release -p data_plane --example <name>`).
[[example]]
name = "decode_bench"
path = "../../benchmarks/micro/decode_bench.rs"

[[example]]
name = "ingest_bench"
path = "../../benchmarks/micro/ingest_bench.rs"

[[example]]
name = "matrix_bench"
path = "../../benchmarks/micro/matrix_bench.rs"

[[example]]
name = "offset_bench"
path = "../../benchmarks/micro/offset_bench.rs"

[[example]]
name = "range_bench"
path = "../../benchmarks/micro/range_bench.rs"

[[example]]
name = "rw_corpus_bench"
path = "../../benchmarks/micro/rw_corpus_bench.rs"

[[example]]
name = "tier_bench"
path = "../../benchmarks/micro/tier_bench.rs"

[[example]]
name = "view_read_bench"
path = "../../benchmarks/micro/view_read_bench.rs"
