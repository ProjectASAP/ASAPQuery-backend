// ddsketch_delta.proto — Delta wire format for DDSketch.
//
// Mirrors `sketchlib-go/proto/ddsketch/ddsketch.proto` DDSketchDelta +
// DDSketchBucketDelta messages byte-for-byte. Kept as a separate tiny
// proto in this crate because the upstream `asap_sketchlib` Rust crate
// only generates the state types today, not the delta types. Once
// `asap_sketchlib` picks these up upstream this vendoring can be removed.
//
// See `sketches/DDSketch/delta.go::ApplyDelta` for the canonical
// merge semantics — additive bucket counts only. The DataPoint-level
// METRIC scalars (count/sum/min/max) were dropped from the wire format
// (ProjectASAP/sketchlib-go#243 / asap_sketchlib#57): the total count is
// recoverable by summing the bucket counts and the remaining aggregates
// are carried by controller-provisioned exact aggregations.

syntax = "proto3";

package sketchlib.v1;

// DDSketchDelta carries only the buckets that changed above threshold.
// Bucket counts are additive. The former count/sum (tags 2-3) and
// min/max scalars (tags 4-7) were removed from the wire format
// (ProjectASAP/sketchlib-go#243): the count is recoverable by summing
// the merged bucket counts; Sum/Min/Max move to exact aggregations.
message DDSketchDelta {
  repeated DDSketchBucketDelta buckets = 1;

  // Tags 2-3 previously carried the additive count/sum deltas and tags
  // 4-7 the lossless min/max scalars + their changed flags. Dropped from
  // the wire format (ProjectASAP/sketchlib-go#243).
  reserved 2, 3, 4, 5, 6, 7;
}

// DDSketchBucketDelta is the delta for one log-scale bucket.
message DDSketchBucketDelta {
  sint32 index   = 1;  // signed bucket index (negative for values < 1)
  uint64 d_count = 2;  // Δcount ≥ threshold T
}
