// hll_delta.proto — Delta wire format for HLL.
//
// The increased registers are varint-packed as (index_delta, value) pairs in
// ascending index order (index_delta from the previous index, starting at 0) —
// the same layout the full sparse register state uses. HLL applies a delta with
// max semantics: registers[idx] = max(registers[idx], value).
//
// No threshold is meaningful for HLL — any skipped register update causes
// permanent underestimation.

syntax = "proto3";

package sketchlib.v1;

message HLLDelta {
  bytes packed_updates = 1;
}
