// countminsketch_delta.proto — Delta wire format for CountMin.
//
// Mirrors the new packed encoding of `CountMinDelta` in
// `sketchlib-go/proto/countminsketch/countminsketch.proto`.
// Deprecated `cells_legacy` cells + their `d_sum` / `d_sum2`
// accessories are omitted — new sketchlib-go producers write
// the packed arrays instead.
//
// Semantics: matrix[cell_rows[i]][cell_cols[i]] += d_counts[i].
// L1 and L2 are per-row norm deltas, transmitted for queryside
// accuracy-accounting; not needed for the core merge.

syntax = "proto3";

package sketchlib.v1;

message CountMinDelta {
  uint32         rows      = 1;
  uint32         cols      = 2;
  repeated double l1        = 4 [packed = true];
  repeated double l2        = 5 [packed = true];
  repeated uint32 cell_rows = 9  [packed = true];
  repeated uint32 cell_cols = 10 [packed = true];
  repeated sint64 d_counts  = 11 [packed = true];
}
