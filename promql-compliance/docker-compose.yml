name: asapquery-backend-promql-compliance

services:
  prometheus:
    image: prom/prometheus:v3.9.1
    ports: ["${PROMETHEUS_PORT:-19090}:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver", "--storage.tsdb.path=/prometheus"]
  data-plane:
    build:
      context: ..
      dockerfile: data_plane/Dockerfile
      additional_contexts:
        asap-precompute-rs: ${ASAP_PRECOMPUTE_RS_CONTEXT}
        asap-sketchlib: ${ASAP_SKETCHLIB_CONTEXT}
        asap-gorilla-rust: ${ASAP_GORILLA_RUST_CONTEXT}
    command: ["--profile", "asapquery", "--planning-snapshot", "/config/planning-snapshot.json", "--forward-unsupported-queries", "--http-port", "9091", "--output-dir", "/tmp/asap"]
    volumes:
      - ${ASAP_PLANNING_SNAPSHOT}:/config/planning-snapshot.json:ro
    ports: ["${BACKEND_PORT:-19091}:9091"]
