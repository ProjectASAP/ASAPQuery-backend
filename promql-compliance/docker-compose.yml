name: asapquery-backend-promql-compliance

services:
  prometheus:
    image: prom/prometheus:v3.9.1
    ports: ["${PROMETHEUS_PORT:-19090}:9090"]
    command: ["--web.enable-remote-write-receiver", "--storage.tsdb.path=/prometheus"]
  control-plane:
    build:
      context: ..
      dockerfile: control_plane/Dockerfile
    environment:
      CONTROLLER_BACKEND_ENDPOINT: http://data-plane:9091/api/v1/physical-plan
    ports: ["${CONTROL_PLANE_PORT:-18080}:8080"]
  data-plane:
    build:
      context: ..
      dockerfile: data_plane/Dockerfile
    command: ["--profile", "asapquery", "--http-port", "9091", "--output-dir", "/tmp/asap"]
    ports: ["${BACKEND_PORT:-19091}:9091"]
