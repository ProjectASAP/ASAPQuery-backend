# ClickHouse single server, the system the backend's ClickHouse route
# (`data_plane --clickhouse-url http://localhost:8123`) forwards to and is
# compared with. Ported from ASAPQuery's experiment service template, with the
# image pinned. It listens on localhost only and keeps its data in a named
# volume (`down -v` removes it).
#
#   docker compose -f eval/baselines/clickhouse/docker-compose.yml up -d
#   curl 'http://localhost:8123/?query=SELECT%20version()'
#   docker compose -f eval/baselines/clickhouse/docker-compose.yml down -v
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      # Naive datetime literals in SQL parse the same here as in the backend.
      - TZ=UTC
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: "no"

volumes:
  clickhouse-data:
