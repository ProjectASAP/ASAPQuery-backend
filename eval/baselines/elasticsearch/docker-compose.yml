# Elasticsearch single node, the system the backend's Elasticsearch routes
# (`data_plane --elastic-url http://localhost:9200`) forward to and are
# compared with. Security is off: it listens on localhost for experiments
# only. Data stays in a named volume (`down -v` removes it); ELASTIC_HEAP
# sets the JVM heap (default 1g).
#
#   docker compose -f eval/baselines/elasticsearch/docker-compose.yml up -d
#   curl http://localhost:9200
#   docker compose -f eval/baselines/elasticsearch/docker-compose.yml down -v
services:
  elasticsearch:
    image: elasticsearch:9.5.3
    ports:
      - "127.0.0.1:${ELASTIC_HTTP_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ELASTIC_HEAP:-1g} -Xmx${ELASTIC_HEAP:-1g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: "no"

volumes:
  elasticsearch-data:
