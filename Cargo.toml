[workspace]
resolver = "2"
members = [
    "crates/adapters/ingest/otlp",
    "crates/adapters/ingest/prometheus-remote-write",
    "crates/adapters/ingest/victoriametrics-remote-write",
    "crates/adapters/query/clickhouse-http",
    "crates/adapters/query/elastic-http",
    "crates/adapters/query/prometheus-http",
    "crates/common",
    "crates/control-plane",
    "crates/data-plane",
    "crates/internal-metrics",
    "crates/precompute",
    "crates/query",
    "crates/storage",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# The backend depends on three Planner crates, at one immutable revision:
# `asap-planner` to plan, `asap-executor` to execute, and `asap-types` for
# the plan types `common`'s boundary names (such as `QueryLanguage`).
# Elsewhere, Planner IR types are reached through `asap_executor::planner`.
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "566b35ca771e2283b1e93385105cd0401a9a67e6" }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "566b35ca771e2283b1e93385105cd0401a9a67e6" }
asap-types = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "566b35ca771e2283b1e93385105cd0401a9a67e6" }
# The sketch library the Planner's executor pins, for the byte encodings of
# the sketch states the data plane persists; keep it at exactly the Planner's
# rev, so cargo builds one copy for both.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "d050037bb127d425cb4160ea9b5960856ef3188c" }

serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: a plan file reloads to the plan it was written from
# (its predicted usage and prices are floats).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clickhouse_http = { path = "crates/adapters/query/clickhouse-http" }
control_plane = { path = "crates/control-plane" }
common = { path = "crates/common" }
elastic_http = { path = "crates/adapters/query/elastic-http" }
internal_metrics = { path = "crates/internal-metrics" }
otlp = { path = "crates/adapters/ingest/otlp" }
precompute = { path = "crates/precompute" }
prometheus_http = { path = "crates/adapters/query/prometheus-http" }
prometheus_remote_write = { path = "crates/adapters/ingest/prometheus-remote-write" }
query = { path = "crates/query" }
storage = { path = "crates/storage" }
victoriametrics_remote_write = { path = "crates/adapters/ingest/victoriametrics-remote-write" }
