[workspace]
resolver = "2"
members = [
    "crates/asap_otel_proto",
    "crates/asap_types",
    "data_plane",
    "control_plane",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Phase 3 step 3: backend ingest path consumes `asap-precompute-rs`,
# which (today) path-deps `asap_sketchlib` from `../../asap_sketchlib`
# (see `ASAPCollector/asap-precompute-rs/Cargo.toml`). The backend
# crates depend on `asap_sketchlib` via a git URL. Without this
# `[patch]`, cargo treats the two sources as distinct crates and the
# `asap_sketchlib::sketches::*` types from the two sides won't unify
# at the FFI boundary (the wrapper-`inner()` → backend-accumulator
# bridge in `precompute_operators::edge_runtime_adapter`).
#
# Pointing both at the local checkout is the same pattern downstream
# Strategy-B adapter consumers will use; flip this to a `git = "..."`
# entry once `asap-precompute-rs` itself moves to a git-sourced
# `asap_sketchlib`.
[patch."https://github.com/ProjectASAP/asap_sketchlib"]
asap_sketchlib = { path = "../asap_sketchlib" }

[workspace.dependencies]
# Keep Planner frontends, selection, and IR on the same immutable main revision.
# Alias upstream asap-types because this workspace also defines asap_types.
planner-types = { package = "asap-types", git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "3be523fa0f06a905188e42cbe482d06aa843ba5d" }
asap-aware-mapping = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "3be523fa0f06a905188e42cbe482d06aa843ba5d" }
asap-frontend-promql = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "3be523fa0f06a905188e42cbe482d06aa843ba5d" }
asap-frontend-sql = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "3be523fa0f06a905188e42cbe482d06aa843ba5d" }

# Shared external deps (used by 2+ crates)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
# One parser source for backend parsing. Member crates inherit this immutable
# ProjectASAP revision through `workspace = true`.
promql-parser = { git = "https://github.com/ProjectASAP/promql-parser", rev = "9fede7eecca923c9882fe256484d00d37f8706cb" }
tokio = { version = "1.0", features = ["full"] }
arc-swap = "1.7"

# Internal crates
asap_types = { path = "crates/asap_types" }
asap_otel_proto = { path = "crates/asap_otel_proto" }
indexmap = { version = "2.0", features = ["serde"] }
