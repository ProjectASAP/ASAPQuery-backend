[workspace]
resolver = "2"
members = ["control_plane", "data_plane"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# The backend depends on two Planner crates, at one immutable revision:
# `asap-planner` to plan and `asap-executor` to execute. Planner IR types
# are reached through `asap_executor::planner`.
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "7a6b2fb5e9fbedd89ca2721e4008fb3c90d09d8c" }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "7a6b2fb5e9fbedd89ca2721e4008fb3c90d09d8c" }
# The sketch library the Planner's executor pins, for the byte encodings of
# the sketch states the data plane persists; keep it at the Planner's rev.
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "93d56eff7a549ae411b90859b000cbecda5cf587" }

serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: a plan file reloads to the plan it was written from
# (its predicted usage and prices are floats).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
control_plane = { path = "control_plane" }
