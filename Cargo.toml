[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/control-plane",
    "crates/data-plane",
    "crates/internal-metrics",
    "crates/precompute",
    "crates/query",
    "crates/storage",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
# The backend depends on three Planner crates, at one immutable revision:
# `asap-planner` to plan, `asap-executor` to execute, and `asap-types` for
# the plan types `common`'s boundary names (`QueryLanguage`, `Source`).
# Elsewhere, Planner IR types are reached through `asap_executor::planner`.
asap-planner = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "1d527bca445b6372f0eb72aafd725d04a3a77dfb" }
asap-executor = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "1d527bca445b6372f0eb72aafd725d04a3a77dfb" }
asap-types = { git = "https://github.com/ProjectASAP/ASAPPlanner", rev = "1d527bca445b6372f0eb72aafd725d04a3a77dfb" }
# The sketch library the Planner's executor pins, for the byte encodings of
# the sketch states the data plane persists; keep it at the Planner's rev
# (here overridden below for the executor too).
asap_sketchlib = { git = "https://github.com/ProjectASAP/asap_sketchlib", rev = "389530ce23b121520f0218a4471e376db2c35945" }

serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: a plan file reloads to the plan it was written from
# (its predicted usage and prices are floats).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
control_plane = { path = "crates/control-plane" }
common = { path = "crates/common" }
internal_metrics = { path = "crates/internal-metrics" }
precompute = { path = "crates/precompute" }
query = { path = "crates/query" }
storage = { path = "crates/storage" }

# asap_sketchlib#271's head, ahead of the Planner's pin (389530c): DDSketch
# view merges in place, with width-specialized loops (a 1 h quantile over
# cold windows 3x faster). Drop when the Planner's pin moves past it. The
# `www.` URL is a distinct source, so it may patch the one the Planner names.
[patch."https://github.com/ProjectASAP/asap_sketchlib"]
asap_sketchlib = { git = "https://www.github.com/ProjectASAP/asap_sketchlib", rev = "355093f48f2649df1b86f2d390c2faa145a5f0a0" }
