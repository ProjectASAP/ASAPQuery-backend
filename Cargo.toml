[workspace]
resolver = "2"
members = [
    "asap-common/dependencies/rs/promql_utilities",
    "asap-common/dependencies/rs/sql_utilities",
    "asap-common/dependencies/rs/elastic_dsl_utilities",
    "asap-common/dependencies/rs/asap_otel_proto",
    "asap-common/dependencies/rs/asap_types",
    "asap-common/dependencies/rs/datafusion_summary_library",
    "asap-common/tests/compare_matched_tokens/rust_tests",
    "asap-common/tests/compare_patterns",
    "asap-query-engine",
    "asap-planner-rs",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Phase 3 step 3: backend ingest path consumes `asap-precompute-rs`,
# which (today) path-deps `asap_sketchlib` from `../../asap_sketchlib`
# (see `ASAPCollector/asap-precompute-rs/Cargo.toml`). The backend
# crates depend on `asap_sketchlib` via a git URL. Without this
# `[patch]`, cargo treats the two sources as distinct crates and the
# `asap_sketchlib::sketches::*` types from the two sides won't unify
# at the FFI boundary (the wrapper-`inner()` → backend-accumulator
# bridge in `precompute_operators::edge_runtime_adapter`).
#
# Pointing both at the local checkout is the same pattern downstream
# Strategy-B adapter consumers will use; flip this to a `git = "..."`
# entry once `asap-precompute-rs` itself moves to a git-sourced
# `asap_sketchlib`.
[patch."https://github.com/ProjectASAP/asap_sketchlib"]
asap_sketchlib = { path = "../asap_sketchlib" }

[workspace.dependencies]
# Shared external deps (used by 2+ crates)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
promql-parser = "0.5.0"
tokio = { version = "1.0", features = ["full"] }
arc-swap = "1.7"

# Internal crates
promql_utilities = { path = "asap-common/dependencies/rs/promql_utilities" }
sql_utilities = { path = "asap-common/dependencies/rs/sql_utilities" }
asap_types = { path = "asap-common/dependencies/rs/asap_types" }
datafusion_summary_library = { path = "asap-common/dependencies/rs/datafusion_summary_library" }
elastic_dsl_utilities = { path = "asap-common/dependencies/rs/elastic_dsl_utilities" }
asap_planner = { path = "asap-planner-rs" }
indexmap = { version = "2.0", features = ["serde"] }
