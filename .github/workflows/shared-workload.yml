name: Shared workload evaluation tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/shared-workload/requirements.txt
      - run: python -m unittest discover -s tools/shared-workload -p 'test_*.py' -v
