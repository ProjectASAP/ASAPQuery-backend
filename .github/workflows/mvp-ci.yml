name: MVP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: MVP backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ASAPQuery-backend
        uses: actions/checkout@v4
        with:
          path: ASAPQuery-backend

      - name: Checkout ASAPCollector dependency
        uses: actions/checkout@v4
        with:
          repository: ProjectASAP/ASAPCollector
          path: ASAPCollector
          token: ${{ secrets.ASAP_CI_REPO_TOKEN }}

      - name: Checkout asap_sketchlib dependency
        uses: actions/checkout@v4
        with:
          repository: ProjectASAP/asap_sketchlib
          # PR #139: standard-update compatibility check used by UnivMon restore.
          ref: c0de315754f9a6c77dd7a25aca0b2b62f0aec276
          path: asap_sketchlib

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Configure private Cargo dependencies
        env:
          ASAP_CI_REPO_TOKEN: ${{ secrets.ASAP_CI_REPO_TOKEN }}
        run: git config --global url."https://x-access-token:${ASAP_CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ASAPQuery-backend
          # The compiled workspace fills the hosted runner before the cache
          # post-step can package `target`; registry/git inputs are sufficient.
          cache-targets: false

      - name: Check formatting
        working-directory: ASAPQuery-backend
        run: cargo fmt -p control_plane -p data_plane -- --check

      - name: Check control plane and data plane
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        working-directory: ASAPQuery-backend
        run: cargo check -p control_plane -p data_plane

      - name: Lint control plane and data plane
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        working-directory: ASAPQuery-backend
        run: cargo clippy -p control_plane -p data_plane --all-targets

      - name: Test MVP control plane
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        working-directory: ASAPQuery-backend
        run: cargo test -p control_plane
