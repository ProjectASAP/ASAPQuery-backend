name: Sync Planner main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-main-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure private Cargo dependencies
        env:
          ASAP_CI_REPO_TOKEN: ${{ secrets.ASAP_CI_REPO_TOKEN }}
        run: git config --global url."https://x-access-token:${ASAP_CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Resolve Planner main
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: python3 scripts/ci/update_planner.py
      # A repository token is needed so the resulting PR triggers MVP CI.
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.ASAP_CI_REPO_TOKEN }}
          branch: automation/planner-main
          base: main
          add-paths: |
            Cargo.toml
            Cargo.lock
          commit-message: 'build: sync ASAPPlanner main'
          title: 'build: sync ASAPPlanner main'
          body: |
            Before this PR: the backend pins an earlier ASAPPlanner revision.
            After this PR: all four Planner dependencies and Cargo.lock use the latest main revision observed by the updater.

            MVP CI runs workspace formatting, checking, linting, and all workspace tests, including process E2E. Successful updates are merged automatically; incompatible updates remain open for investigation.
