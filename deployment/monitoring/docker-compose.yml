# Monitoring for the ASAP data plane vs VictoriaMetrics demo: a monitoring
# Prometheus (127.0.0.1:19090), node-exporter (19091, with the harness
# report's textfile), process-exporter (19092) and Grafana (GRAFANA_PORT,
# default 13000, dashboard "asap-vs-vm"). Host networking, so every scrape
# target is on the run host's loopback.
#
# ASAPQ_BENCH is this repository's eval/ directory (see eval/README.md).
#   ASAPQ_BENCH=$ASAPQ_BENCH sudo -n -E docker compose -f deployment/monitoring/docker-compose.yml up -d
#
# Without docker: deployment/monitoring/run_binaries.sh starts the same stack from the
# pinned release binaries in $BIN_DIR.
name: asap-vs-vm-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ${ASAPQ_BENCH:?set ASAPQ_BENCH}/../deployment/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - monitoring-prometheus:/prometheus
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:19091
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - ${ASAPQ_BENCH:?set ASAPQ_BENCH}/../deployment/monitoring/textfile:/textfile:ro
  process-exporter:
    image: ncabatoff/process-exporter:0.8.7@sha256:bc2363ff7e05ada1b2a694f06c43dc824dc26cd6e487b5d36b66b1a40df4e842
    network_mode: host
    pid: host
    privileged: true
    restart: unless-stopped
    command:
      - --procfs=/host/proc
      - --config.path=/config/config.yml
      - --web.listen-address=127.0.0.1:19092
      - --threads=false
    volumes:
      - /proc:/host/proc:ro
      - ${ASAPQ_BENCH:?set ASAPQ_BENCH}/../deployment/monitoring/process-exporter:/config:ro
  grafana:
    image: grafana/grafana:12.4.14@sha256:ae509d9ae8c1021ca32ec370a9ca975d40165eda9fccd1e1102d317ff8787cd7
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-13000}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/asap-vs-vm.json
      ASAP_DASHBOARDS_DIR: /var/lib/grafana/dashboards
    volumes:
      - ${ASAPQ_BENCH:?set ASAPQ_BENCH}/../deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${ASAPQ_BENCH:?set ASAPQ_BENCH}/../deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - monitoring-grafana:/var/lib/grafana
volumes:
  monitoring-prometheus:
  monitoring-grafana:
